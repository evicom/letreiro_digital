<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Letreiro Digital Personalizável</title>
    <meta name="description" content="Letreiro digital estilo placar eletrônico, personalizável, em tela cheia e instalável como app." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Letreiro" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

    <!-- Fonte estilo placar eletrônico (Orbitron) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet" />

    <style>
        /* Reset e base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            /* height dinâmica real do viewport (corrige barras do navegador mobile) */
            height: 100dvh;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            inset: 0;
            /* respeita áreas seguras (notch) tanto em retrato quanto paisagem */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Painel do letreiro */
        .letreiro-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            padding: 20px;
            min-height: 0;
            min-width: 0;
        }

        .letreiro {
            width: 100%;
            height: 100%;
            background: #000;
            border: 4px solid #ffcc00;
            border-radius: 20px;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        /* Texto rolante — o tamanho em px é calculado via JS para sempre
           preencher a altura disponível, em pé ou deitado */
        .mensagem {
            font-weight: 900;
            color: #ffcc00;
            white-space: nowrap;
            padding: 0 50px;
            position: absolute;
            animation: scroll 20s linear infinite;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: color 0.3s, font-family 0.2s, text-shadow 0.3s;
            line-height: 1;
        }

        @keyframes scroll {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* --- Botões flutuantes (tela cheia / instalar) --- */
        .flutuantes {
            position: absolute;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        .btn-icone {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffcc00;
            background: rgba(0, 0, 0, 0.55);
            color: #ffcc00;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.15s, background 0.2s;
        }
        .btn-icone:hover {
            background: rgba(255, 204, 0, 0.15);
            transform: scale(1.05);
        }
        .btn-icone:active {
            transform: scale(0.93);
        }
        .btn-icone[hidden] {
            display: none;
        }

        /* --- Controles --- */
        .controles {
            background: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 20px;
            border-top: 2px solid #333;
            flex-shrink: 0;
            max-height: 40vh;
            overflow-y: auto;
            transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
        }

        /* Modo tela cheia: controles ficam ocultos por padrão para o letreiro
           ocupar 100% da tela; um botão discreto reabre o painel */
        body.fullscreen-ativo .controles {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            pointer-events: none;
            border-top: none;
        }
        body.fullscreen-ativo.painel-aberto .controles {
            max-height: 45vh;
            padding: 15px 20px;
            opacity: 1;
            pointer-events: auto;
            border-top: 2px solid #333;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 140px;
            min-width: 120px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #ccc;
            font-weight: 600;
            white-space: nowrap;
        }

        .control-group input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
            transition: border 0.2s;
            min-width: 100px;
        }
        .control-group input[type="text"]:focus {
            border-color: #ffcc00;
        }

        .control-group select {
            padding: 8px 12px;
            font-size: 0.95rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }
        .control-group select:focus {
            border-color: #ffcc00;
        }

        .control-group input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: #ffcc00;
            cursor: pointer;
        }
        .control-group .value-display {
            min-width: 35px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
        }

        .control-group input[type="color"] {
            width: 40px;
            height: 40px;
            border: 2px solid #444;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            padding: 2px;
        }
        .control-group input[type="color"]:hover {
            border-color: #ffcc00;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-group button {
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ffcc00;
            color: #000;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-group button:hover {
            background: #ffd633;
            transform: scale(1.02);
        }
        .btn-group button:active {
            transform: scale(0.97);
        }

        /* Alça para reabrir o painel quando estiver oculto em tela cheia */
        .alca-painel {
            position: absolute;
            bottom: calc(10px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 54px;
            height: 22px;
            border-radius: 999px;
            background: rgba(255, 204, 0, 0.85);
            border: none;
            z-index: 20;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
        }
        body.fullscreen-ativo .alca-painel {
            display: flex;
        }

        /* Responsividade — retrato (vertical) */
        @media (orientation: portrait) {
            .mensagem {
                padding: 0 20px;
                letter-spacing: 2px;
            }
        }

        /* Responsividade — paisagem (horizontal) */
        @media (orientation: landscape) {
            .controles {
                max-height: 32vh;
            }
        }

        @media (max-width: 768px) {
            .letreiro-container {
                padding: 10px;
            }
            .letreiro {
                border-width: 3px;
                border-radius: 12px;
            }
            .controles {
                padding: 12px 15px;
                gap: 10px;
                max-height: 50vh;
            }
            .control-group {
                flex: 1 1 100%;
                min-width: auto;
            }
            .control-group input[type="text"],
            .control-group select,
            .control-group input[type="range"] {
                flex: 1;
                min-width: 60px;
            }
            .control-group input[type="color"] {
                width: 36px;
                height: 36px;
            }
            .btn-group {
                width: 100%;
                justify-content: center;
            }
            .btn-group button {
                flex: 1;
                max-width: 200px;
            }
        }

        @media (max-width: 400px) {
            .control-group label {
                font-size: 0.75rem;
            }
        }

        /* Respeita usuários que preferem menos movimento */
        @media (prefers-reduced-motion: reduce) {
            .mensagem {
                animation-duration: 40s !important;
            }
        }
    </style>
</head>
<body>

    <div class="letreiro-container">
        <div class="letreiro">
            <div class="mensagem" id="mensagemTexto">Digite sua mensagem</div>

            <div class="flutuantes">
                <button class="btn-icone" id="btnInstalar" title="Instalar app" hidden>⬇️</button>
                <button class="btn-icone" id="btnFullscreen" title="Tela cheia">⛶</button>
            </div>
        </div>

        <button class="alca-painel" id="alcaPainel" title="Mostrar/ocultar controles">▲ painel</button>
    </div>

    <div class="controles" id="painelControles">
        <!-- Texto -->
        <div class="control-group">
            <label for="inputMensagem">Texto:</label>
            <input type="text" id="inputMensagem" placeholder="Ex: Bem-vindos!" value="Digite sua mensagem" />
        </div>

        <!-- Fonte -->
        <div class="control-group">
            <label for="fontFamily">Fonte:</label>
            <select id="fontFamily">
                <option value="'Segoe UI', sans-serif">Padrão</option>
                <option value="'Orbitron', sans-serif" selected>Orbitron (Placar Eletrônico)</option>
                <option value="'Impact', sans-serif">Impact</option>
                <option value="'Arial Black', sans-serif">Arial Black</option>
                <option value="'Courier New', monospace">Courier</option>
                <option value="'Verdana', sans-serif">Verdana</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
            </select>
        </div>

        <!-- Tamanho (% da altura do painel, preenche a tela em qualquer orientação) -->
        <div class="control-group">
            <label for="fontSize">Tamanho:</label>
            <input type="range" id="fontSize" min="20" max="95" value="65" step="1" />
            <span class="value-display" id="fontSizeVal">65%</span>
        </div>

        <!-- Velocidade (segundos) -->
        <div class="control-group">
            <label for="velocidade">Veloc.:</label>
            <input type="range" id="velocidade" min="5" max="60" value="20" step="1" />
            <span class="value-display" id="velocidadeValor">20s</span>
        </div>

        <!-- Cores -->
        <div class="control-group">
            <label for="textColor">Texto:</label>
            <input type="color" id="textColor" value="#ffcc00" />
        </div>
        <div class="control-group">
            <label for="bgColor">Fundo:</label>
            <input type="color" id="bgColor" value="#000000" />
        </div>
        <div class="control-group">
            <label for="borderColor">Borda:</label>
            <input type="color" id="borderColor" value="#ffcc00" />
        </div>

        <!-- Botões -->
        <div class="btn-group">
            <button id="btnAtualizar">Atualizar</button>
        </div>
    </div>

    <script>
        (function() {
            const mensagemEl = document.getElementById('mensagemTexto');
            const letreiroBox = document.querySelector('.letreiro');
            const body = document.body;

            const inputMensagem = document.getElementById('inputMensagem');
            const fontFamily = document.getElementById('fontFamily');
            const fontSize = document.getElementById('fontSize');
            const fontSizeVal = document.getElementById('fontSizeVal');
            const inputVelocidade = document.getElementById('velocidade');
            const velocidadeValor = document.getElementById('velocidadeValor');
            const textColor = document.getElementById('textColor');
            const bgColor = document.getElementById('bgColor');
            const borderColor = document.getElementById('borderColor');
            const btnAtualizar = document.getElementById('btnAtualizar');
            const btnFullscreen = document.getElementById('btnFullscreen');
            const btnInstalar = document.getElementById('btnInstalar');
            const alcaPainel = document.getElementById('alcaPainel');

            // ---------- Ajusta o tamanho da fonte para SEMPRE preencher a
            // altura disponível do letreiro, tanto em retrato quanto em
            // paisagem (o slider define a porcentagem dessa altura) ----------
            function aplicarTamanhoFonte() {
                const percentual = parseFloat(fontSize.value);
                const alturaDisponivel = letreiroBox.clientHeight;
                const tamanhoPx = Math.max(12, (alturaDisponivel * percentual) / 100);
                mensagemEl.style.fontSize = tamanhoPx + 'px';
                fontSizeVal.textContent = percentual + '%';
            }

            function atualizarLetreiro() {
                // 1. Texto
                const texto = inputMensagem.value.trim();
                mensagemEl.textContent = texto === '' ? '⚠️ Digite uma mensagem' : texto;

                // 2. Velocidade
                const duracao = inputVelocidade.value;
                mensagemEl.style.animationDuration = duracao + 's';
                velocidadeValor.textContent = duracao + 's';

                // 3. Fonte
                mensagemEl.style.fontFamily = fontFamily.value;

                // 4. Tamanho — recalculado com base na altura real do painel
                aplicarTamanhoFonte();

                // 5. Cores
                const corTexto = textColor.value;
                mensagemEl.style.color = corTexto;
                mensagemEl.style.textShadow = `0 0 10px ${corTexto}, 0 0 20px ${corTexto}, 0 0 40px ${corTexto}`;

                const corFundo = bgColor.value;
                letreiroBox.style.backgroundColor = corFundo;

                const corBorda = borderColor.value;
                letreiroBox.style.borderColor = corBorda;
                letreiroBox.style.boxShadow = `0 0 30px ${corBorda}, inset 0 0 30px ${corBorda}`;
            }

            inputVelocidade.addEventListener('input', atualizarLetreiro);
            fontFamily.addEventListener('change', atualizarLetreiro);
            fontSize.addEventListener('input', atualizarLetreiro);
            textColor.addEventListener('input', atualizarLetreiro);
            bgColor.addEventListener('input', atualizarLetreiro);
            borderColor.addEventListener('input', atualizarLetreiro);

            btnAtualizar.addEventListener('click', atualizarLetreiro);
            inputMensagem.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    atualizarLetreiro();
                }
            });

            // Recalcula a fonte sempre que o tamanho da tela/orientação mudar
            window.addEventListener('resize', aplicarTamanhoFonte);
            window.addEventListener('orientationchange', () => {
                setTimeout(aplicarTamanhoFonte, 150);
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', aplicarTamanhoFonte);
            }
            if (window.ResizeObserver) {
                new ResizeObserver(aplicarTamanhoFonte).observe(letreiroBox);
            }

            // ---------- Tela cheia ----------
            function estaEmFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement);
            }

            async function alternarFullscreen() {
                try {
                    if (!estaEmFullscreen()) {
                        const el = document.documentElement;
                        if (el.requestFullscreen) await el.requestFullscreen();
                        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

                        // Tenta travar a orientação (suportado principalmente em
                        // Chrome/Android; falha silenciosamente nos demais)
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('any').catch(() => {});
                        }
                    } else {
                        if (document.exitFullscreen) await document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                } catch (err) {
                    console.warn('Tela cheia não suportada ou bloqueada:', err);
                }
            }

            function atualizarEstadoFullscreen() {
                const ativo = estaEmFullscreen();
                body.classList.toggle('fullscreen-ativo', ativo);
                if (!ativo) body.classList.remove('painel-aberto');
                btnFullscreen.textContent = ativo ? '×' : '⛶';
                btnFullscreen.title = ativo ? 'Sair da tela cheia' : 'Tela cheia';
                setTimeout(aplicarTamanhoFonte, 100);
            }

            btnFullscreen.addEventListener('click', alternarFullscreen);
            document.addEventListener('fullscreenchange', atualizarEstadoFullscreen);
            document.addEventListener('webkitfullscreenchange', atualizarEstadoFullscreen);

            alcaPainel.addEventListener('click', () => {
                body.classList.toggle('painel-aberto');
                setTimeout(aplicarTamanhoFonte, 300);
            });

            // Toca o letreiro para abrir/fechar o painel rapidamente quando em tela cheia
            letreiroBox.addEventListener('dblclick', alternarFullscreen);

            // ---------- Instalar como app (PWA) ----------
            let promptDiferido = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                promptDiferido = e;
                btnInstalar.hidden = false;
            });

            btnInstalar.addEventListener('click', async () => {
                if (!promptDiferido) return;
                promptDiferido.prompt();
                await promptDiferido.userChoice;
                promptDiferido = null;
                btnInstalar.hidden = true;
            });

            window.addEventListener('appinstalled', () => {
                btnInstalar.hidden = true;
            });

            // ---------- Service worker (funciona offline / instalável) ----------
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch((err) => {
                        console.warn('Falha ao registrar service worker:', err);
                    });
                });
            }

            atualizarLetreiro();
        })();
    </script>
</body>
</html>
