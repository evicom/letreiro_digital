<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Letreiro Digital Personalizável</title>

<!-- ===== PWA META TAGS ===== -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#07080c" />
<meta name="description" content="Crie letreiros digitais neon personalizados com animações e efeitos brilhantes." />

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Letreiro" />
<link rel="apple-touch-icon" href="icon.svg" />

<!-- Android / Windows -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="Letreiro" />
<meta name="msapplication-TileColor" content="#07080c" />
<meta name="msapplication-config" content="manifest.json" />

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="shortcut icon" href="icon.svg" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Doto:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#07080c;
    --bg-1:#0d1018;
    --panel:rgba(22,26,40,.65);
    --border:rgba(255,255,255,.08);
    --text:#e8ecf4;
    --muted:#8a93a8;
    --accent:#00e5ff;
    --accent-2:#ff2bd6;
    --ok:#3ddc97;
    --pad:22px;
    --gap:22px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 800px at 10% -10%, rgba(0,229,255,.15), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(255,43,214,.15), transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 60%,var(--bg-0));
    min-height:100%;
    overflow-x:hidden;
    transition: background .3s ease;
    /* Safe area para notch/home indicator em iOS */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ===== HEADER ===== */
  header{
    padding:18px var(--pad);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--border);
    backdrop-filter: blur(10px);
    position:sticky;top:0;z-index:10;
    background:rgba(7,8,12,.7);
    flex-wrap:wrap;
    transition: padding .3s ease;
  }
  header h1{
    margin:0;font-size:16px;letter-spacing:.3em;text-transform:uppercase;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transition: font-size .3s ease;
  }
  .header-actions{display:flex;gap:8px;flex-wrap:wrap}
  .icon-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 12px;border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    color:var(--text);
    font-family:inherit;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    cursor:pointer;transition:.2s;font-weight:600;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn.active{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#000;border-color:transparent;
  }
  .icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* ===== BOTÃO INSTALAR ===== */
  .install-btn{
    display:none;
    background:linear-gradient(90deg,var(--ok),#2bb87d);
    color:#001a10;border:0;
    animation: pulseInstall 2s ease-in-out infinite;
  }
  .install-btn.show{display:inline-flex}
  @keyframes pulseInstall{
    0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}
    50%{box-shadow:0 0 0 8px rgba(61,220,151,0)}
  }

  /* ===== MAIN ===== */
  main{
    display:flex;
    flex-direction:column;
    gap:var(--gap);
    padding:var(--pad);
    max-width:1400px;margin:0 auto;
    transition: padding .3s ease, gap .3s ease;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    transition: padding .3s ease, border-radius .3s ease, background .3s ease;
  }
  .panel h2{
    font-size:12px;letter-spacing:.25em;text-transform:uppercase;
    color:var(--muted);margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .panel h2::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 12px var(--accent);
  }

  /* ===== PREVIEW ===== */
  .preview-wrap{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    min-height: 180px;
    height: var(--preview-h, 260px);
    max-height: 80vh;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
      linear-gradient(180deg,#000,#05070d);
    transition: height .3s ease, border-radius .3s ease, border .3s ease;
  }
  .preview-wrap::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
    transition: opacity .3s ease;
  }
  .marquee{
    position:relative;
    display:flex;align-items:center;
    width:100%;height:100%;
    overflow:hidden;
    padding:0 20px;
    transition: padding .3s ease;
  }
  .marquee-track{
    display:inline-block;
    white-space:nowrap;
    will-change:transform;
    line-height:1.0;
    max-height:100%;
    vertical-align:middle;
  }
  .marquee-track.blink{ animation: blink var(--blink,1s) steps(2,start) infinite }
  @keyframes blink { 50% { opacity:0 } }

  /* ===== CONTROLES ===== */
  .controls-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:18px;
    transition: gap .3s ease;
  }

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);display:flex;justify-content:space-between;align-items:center;
  }
  .field label .val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  input[type="text"], select{
    width:100%;
    background:rgba(0,0,0,.35);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;border-radius:10px;
    font-size:14px;font-family:inherit;
    transition:border-color .2s, box-shadow .2s;
  }
  input[type="text"]:focus, select:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,229,255,.15);
  }
  input[type="range"]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:6px;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);
    box-shadow:0 0 10px rgba(0,229,255,.6);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);
    cursor:pointer;
  }
  input[type="color"]{
    width:100%;height:40px;border:1px solid var(--border);
    border-radius:10px;background:transparent;cursor:pointer;padding:4px;
  }
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{
    display:flex;background:rgba(0,0,0,.35);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  .seg button{
    flex:1;background:transparent;border:0;color:var(--muted);
    padding:9px 10px;font-size:12px;cursor:pointer;
    font-family:inherit;letter-spacing:.1em;text-transform:uppercase;
    transition:.2s;
  }
  .seg button.active{
    color:#000;background:linear-gradient(90deg,var(--accent),var(--accent-2));
    font-weight:700;
  }
  .seg button:hover:not(.active){color:var(--text)}

  .switch{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:rgba(0,0,0,.3);
    border:1px solid var(--border);border-radius:10px;
  }
  .switch span{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .toggle{
    position:relative;width:42px;height:24px;border-radius:999px;
    background:rgba(255,255,255,.1);cursor:pointer;transition:.2s;
    flex-shrink:0;
  }
  .toggle::after{
    content:"";position:absolute;top:3px;left:3px;
    width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;
  }
  .toggle.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .toggle.on::after{left:21px}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .btn{
    flex:1;min-width:120px;
    padding:12px 16px;border-radius:10px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);color:var(--text);
    font-family:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    cursor:pointer;transition:.2s;font-weight:600;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#000;border:0;
  }
  .btn.primary:hover{filter:brightness(1.1);color:#000}

  .group{padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.15)}
  .group h3{margin:0 0 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ok);color:#001a10;padding:12px 20px;border-radius:10px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;
    opacity:0;transition:.3s;pointer-events:none;z-index:50;
    max-width:90vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* ===== FULLSCREEN MODE ===== */
  body.fullscreen-mode{background:#000 !important;overflow:hidden}
  body.fullscreen-mode header,
  body.fullscreen-mode .controls-panel{display:none !important}
  body.fullscreen-mode main{padding:0;gap:0;height:100vh;max-width:none;margin:0}
  body.fullscreen-mode .panel:first-child{
    height:100vh;width:100vw;border-radius:0;border:0;padding:0;
    background:#000 !important;display:flex;align-items:center;justify-content:center;
    box-shadow:none;backdrop-filter:none;
  }
  body.fullscreen-mode .panel:first-child h2{display:none}
  body.fullscreen-mode .preview-wrap{
    width:100vw;height:100vh;max-height:100vh;min-height:0;
    border-radius:0;border:0;background:#000 !important;
  }
  body.fullscreen-mode .preview-wrap::after{display:none}
  body.fullscreen-mode .marquee{padding:0 4vw}
  .exit-fs{
    position:fixed;top:16px;right:16px;z-index:100;
    padding:10px 14px;border-radius:10px;
    background:rgba(0,0,0,.75);border:1px solid var(--accent);
    color:var(--accent);font-family:inherit;font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;cursor:pointer;
    display:none;backdrop-filter: blur(10px);
  }
  body.fullscreen-mode .exit-fs{display:block}

  /* ===== RESPONSIVO ===== */
  @media (max-width: 1000px){.controls-grid{grid-template-columns:1fr}}
  @media (max-width: 700px){
    :root{--pad:14px;--gap:14px}
    header{padding:14px}
    header h1{font-size:13px;letter-spacing:.2em}
    .icon-btn{padding:8px 10px;font-size:0;gap:0}
    .icon-btn svg{width:16px;height:16px}
    .icon-btn span{display:none}
    .panel{padding:14px;border-radius:14px}
    .panel h2{font-size:11px;margin-bottom:12px}
    .group{padding:12px}
    .group h3{font-size:10px;margin-bottom:10px}
    .field label{font-size:10px}
    input[type="text"], select{padding:9px 10px;font-size:13px}
    .seg button{font-size:11px;padding:8px 6px}
    .btn{min-width:100px;padding:10px 12px;font-size:11px}
    .actions{gap:8px}
    .controls-grid{gap:12px}
    .marquee{padding:0 12px}
  }
  @media (max-width: 400px){
    header h1{font-size:11px;letter-spacing:.15em}
    .icon-btn{padding:7px 9px}
    .icon-btn svg{width:14px;height:14px}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Letreiro Digital</h1>
  <div class="header-actions">
    <!-- NOVO: Botão de instalação -->
    <button class="icon-btn install-btn" id="btnInstall" title="Instalar app">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      <span>Instalar</span>
    </button>
    <button class="icon-btn" id="btnFullscreen" title="Tela cheia">
      <svg viewBox="0 0 24 24"><path d="M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6"/></svg>
      <span>Tela cheia</span>
    </button>
    <button class="icon-btn" id="btnWake" title="Manter tela ativada">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span>Tela ativa</span>
    </button>
    <button class="icon-btn" id="btnShare" title="Compartilhar site">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
      <span>Compartilhar</span>
    </button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Visualização</h2>
    <div class="preview-wrap" id="preview">
      <div class="marquee">
        <div class="marquee-track" id="track">coloque sua mensagem aqui!</div>
      </div>
    </div>
  </section>

  <section class="panel controls-panel">
    <h2>Controles</h2>
    <div class="controls-grid">
      <div class="group">
        <h3>Texto & Fonte</h3>
        <div class="field">
          <label>Texto</label>
          <input type="text" id="txtTexto" value="coloque sua mensagem aqui!" />
        </div>
        <div class="field">
          <label>Fonte</label>
          <select id="txtFonte">
            <option value="Orbitron" selected>Orbitron (Placar)</option>
            <option value="Doto">Doto (LED)</option>
            <option value="Impact">Impact</option>
            <option value="Arial Black">Arial Black</option>
          </select>
        </div>
        <div class="field">
          <label>Tamanho <span class="val" id="vTam">80px</span></label>
          <input type="range" id="txtTam" min="20" max="300" value="80" />
        </div>
      </div>

      <div class="group">
        <h3>Animação</h3>
        <div class="field">
          <label>Velocidade <span class="val" id="vVel">20s</span></label>
          <input type="range" id="txtVel" min="2" max="60" value="20" />
        </div>
        <div class="field">
          <label>Direção</label>
          <div class="seg" id="segDir">
            <button data-v="left" class="active">← Esquerda</button>
            <button data-v="right">Direita →</button>
          </div>
        </div>
        <div class="switch" style="margin-top:10px">
          <span>Piscar</span>
          <div class="toggle" id="tgBlink"></div>
        </div>
        <div class="field" style="margin-top:10px">
          <label>Vel. pisca <span class="val" id="vBlink">1s</span></label>
          <input type="range" id="txtBlink" min="0.2" max="3" step="0.1" value="1" />
        </div>
      </div>

      <div class="group">
        <h3>Aparência</h3>
        <div class="field">
          <label>Intensidade neon <span class="val" id="vInt">30%</span></label>
          <input type="range" id="txtInt" min="0" max="100" value="30" />
        </div>
        <div class="field">
          <label>Brilho <span class="val" id="vBrilho">16px</span></label>
          <input type="range" id="txtBrilho" min="0" max="60" value="16" />
        </div>
        <div class="row">
          <div class="field">
            <label>Cor do texto</label>
            <input type="color" id="txtCor" value="#00e5ff" />
          </div>
          <div class="field">
            <label>Cor do fundo</label>
            <input type="color" id="txtFundo" value="#000000" />
          </div>
        </div>
      </div>
    </div>

    <div class="actions" style="margin-top:18px">
      <button class="btn primary" id="btnAtualizar">⚡ Atualizar</button>
      <button class="btn" id="btnRedefinir">↺ Redefinir</button>
    </div>
  </section>
</main>

<button class="exit-fs" id="exitFs">✕ Sair</button>
<div class="toast" id="toast">Configuração copiada!</div>

<script>
  const $ = id => document.getElementById(id);
  const track = $('track');
  const preview = $('preview');

  const defaults = {
    texto:"coloque sua mensagem aqui!", fonte:"Orbitron", tam:80,
    vel:20, dir:"left", blink:false, blinkVel:1,
    int:30, brilho:16, cor:"#00e5ff", fundo:"#000000"
  };
  let state = {...defaults};
  let isFullscreen = false;

  // ===== RENDER =====
  function render(){
    track.textContent = state.texto || " ";
    track.style.fontFamily = `'${state.fonte}', sans-serif`;
    track.style.fontSize = state.tam + 'px';
    track.style.color = state.cor;
    track.style.fontWeight = state.fonte === 'Doto' ? '700' : '900';

    let h;
    if (isFullscreen){
      h = window.innerHeight;
    } else {
      const calculated = state.tam * 1.5 + 40;
      h = Math.min(Math.max(calculated, 180), window.innerHeight * 0.8);
    }
    preview.style.setProperty('--preview-h', h + 'px');

    const glow = state.brilho * (state.int/100);
    const g2 = glow * 2;
    track.style.textShadow = `
      0 0 ${glow}px ${state.cor},
      0 0 ${g2}px ${state.cor},
      0 0 ${g2*2}px ${state.cor}40
    `;

    if (!isFullscreen){
      preview.style.background = `
        repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, ${state.fundo}, ${shade(state.fundo,-20)})
      `;
    } else {
      preview.style.background = '#000';
    }

    track.classList.toggle('blink', state.blink);
    track.style.setProperty('--blink', state.blinkVel + 's');
    startMarquee();
  }

  // ===== MARQUEE =====
  let rafId = null;
  let pos = 0;
  function startMarquee(){
    if (rafId) cancelAnimationFrame(rafId);
    const wrapW = preview.clientWidth;
    const txtW = track.offsetWidth;
    const dur = state.vel * 1000;
    const totalDist = wrapW + txtW;
    const pxPerMs = totalDist / dur;
    let last = performance.now();

    if (state.dir === 'left') pos = wrapW;
    else pos = -txtW;

    function loop(now){
      const dt = now - last; last = now;
      const step = pxPerMs * dt;
      if (state.dir === 'left'){
        pos -= step;
        if (pos < -txtW) pos = wrapW;
      } else {
        pos += step;
        if (pos > wrapW) pos = -txtW;
      }
      track.style.transform = `translateX(${pos}px)`;
      rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);
  }

  function shade(hex, percent){
    const n = parseInt(hex.slice(1),16);
    let r = (n>>16) + percent;
    let g = ((n>>8)&0xff) + percent;
    let b = (n&0xff) + percent;
    r = Math.max(0,Math.min(255,r));
    g = Math.max(0,Math.min(255,g));
    b = Math.max(0,Math.min(255,b));
    return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }

  function updateLabels(){
    $('vTam').textContent = state.tam + 'px';
    $('vVel').textContent = state.vel + 's';
    $('vBlink').textContent = state.blinkVel + 's';
    $('vInt').textContent = state.int + '%';
    $('vBrilho').textContent = state.brilho + 'px';
  }

  // ===== BINDINGS =====
  $('txtTexto').addEventListener('input', e => { state.texto = e.target.value; render(); });
  $('txtFonte').addEventListener('change', e => { state.fonte = e.target.value; render(); });
  $('txtTam').addEventListener('input', e => { state.tam = +e.target.value; updateLabels(); render(); });
  $('txtVel').addEventListener('input', e => { state.vel = +e.target.value; updateLabels(); render(); });
  $('txtBlink').addEventListener('input', e => { state.blinkVel = +e.target.value; updateLabels(); render(); });
  $('txtInt').addEventListener('input', e => { state.int = +e.target.value; updateLabels(); render(); });
  $('txtBrilho').addEventListener('input', e => { state.brilho = +e.target.value; updateLabels(); render(); });
  $('txtCor').addEventListener('input', e => { state.cor = e.target.value; render(); });
  $('txtFundo').addEventListener('input', e => { state.fundo = e.target.value; render(); });

  document.querySelectorAll('#segDir button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#segDir button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.dir = b.dataset.v;
      render();
    });
  });

  $('tgBlink').addEventListener('click', e=>{
    state.blink = !state.blink;
    e.currentTarget.classList.toggle('on', state.blink);
    render();
  });

  $('btnAtualizar').addEventListener('click', ()=>{ render(); toast('Atualizado!'); });
  $('btnRedefinir').addEventListener('click', ()=>{
    state = {...defaults};
    $('txtTexto').value = state.texto;
    $('txtFonte').value = state.fonte;
    $('txtTam').value = state.tam;
    $('txtVel').value = state.vel;
    $('txtBlink').value = state.blinkVel;
    $('txtInt').value = state.int;
    $('txtBrilho').value = state.brilho;
    $('txtCor').value = state.cor;
    $('txtFundo').value = state.fundo;
    $('tgBlink').classList.remove('on');
    document.querySelectorAll('#segDir button').forEach(x=>x.classList.toggle('active', x.dataset.v==='left'));
    updateLabels();
    render();
    toast('Redefinido!');
  });

  // ===== TELA CHEIA =====
  function enterFullscreen(){
    isFullscreen = true;
    document.body.classList.add('fullscreen-mode');
    $('btnFullscreen').classList.add('active');
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    render();
  }
  function exitFullscreen(){
    isFullscreen = false;
    document.body.classList.remove('fullscreen-mode');
    $('btnFullscreen').classList.remove('active');
    if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
    render();
  }
  $('btnFullscreen').addEventListener('click', ()=>{
    if (!isFullscreen) enterFullscreen(); else exitFullscreen();
  });
  $('exitFs').addEventListener('click', exitFullscreen);
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement && isFullscreen){
      isFullscreen = false;
      document.body.classList.remove('fullscreen-mode');
      $('btnFullscreen').classList.remove('active');
      render();
    }
  });

  // ===== WAKE LOCK =====
  let wakeLock = null;
  async function toggleWake(){
    if (!('wakeLock' in navigator)){ toast('Wake Lock não suportado'); return; }
    try{
      if (wakeLock){
        await wakeLock.release();
        wakeLock = null;
        $('btnWake').classList.remove('active');
        toast('Tela pode dormir');
      } else {
        wakeLock = await navigator.wakeLock.request('screen');
        $('btnWake').classList.add('active');
        toast('Tela mantida ativa ☀');
        wakeLock.addEventListener('release', ()=> $('btnWake').classList.remove('active'));
      }
    }catch(e){ toast('Erro: ' + e.message); }
  }
  $('btnWake').addEventListener('click', toggleWake);
  document.addEventListener('visibilitychange', async ()=>{
    if (wakeLock !== null && document.visibilityState === 'visible'){
      wakeLock = null; await toggleWake();
    }
  });

  // ===== COMPARTILHAR =====
  $('btnShare').addEventListener('click', async ()=>{
    const shareUrl = location.origin + location.pathname + '#' + btoa(JSON.stringify(state));
    const shareData = {
      title: 'Letreiro Digital Personalizável',
      text: 'Confira meu letreiro digital neon!',
      url: shareUrl
    };
    if (navigator.share){
      try{ await navigator.share(shareData); toast('Compartilhado!'); }
      catch(e){ if (e.name !== 'AbortError') copyLink(shareUrl); }
    } else { copyLink(shareUrl); }
  });

  async function copyLink(url){
    try{ await navigator.clipboard.writeText(url); toast('Link copiado!'); }
    catch{ prompt('Copie o link:', url); }
  }

  // ===== PWA - INSTALAÇÃO =====
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $('btnInstall').classList.add('show');
  });

  $('btnInstall').addEventListener('click', async () => {
    if (!deferredPrompt) {
      toast('App já instalado ou não suportado');
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    toast(outcome === 'accepted' ? 'App instalado! 🎉' : 'Instalação cancelada');
    deferredPrompt = null;
    $('btnInstall').classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    $('btnInstall').classList.remove('show');
    toast('App instalado com sucesso! 🎉');
    deferredPrompt = null;
  });

  // Esconde botão se já estiver em modo standalone (instalado)
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
    $('btnInstall').classList.remove('show');
  }

  // ===== SERVICE WORKER =====
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ SW registrado:', reg.scope))
        .catch(err => console.warn('❌ SW falhou:', err));
    });
  }

  // ===== TOAST =====
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // Carregar da URL
  try{
    if (location.hash.length > 1){
      const s = JSON.parse(atob(location.hash.slice(1)));
      Object.assign(state, s);
      $('txtTexto').value = state.texto;
      $('txtFonte').value = state.fonte;
      $('txtTam').value = state.tam;
      $('txtVel').value = state.vel;
      $('txtBlink').value = state.blinkVel;
      $('txtInt').value = state.int;
      $('txtBrilho').value = state.brilho;
      $('txtCor').value = state.cor;
      $('txtFundo').value = state.fundo;
      if (state.blink) $('tgBlink').classList.add('on');
      document.querySelectorAll('#segDir button').forEach(x=>x.classList.toggle('active', x.dataset.v===state.dir));
      updateLabels();
    }
  }catch(e){}

  window.addEventListener('resize', ()=>{ startMarquee(); render(); });

  updateLabels();
  render();
</script>
</body>
</html>
