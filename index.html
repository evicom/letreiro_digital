<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letreiro Digital Personalizável</title>
    <!-- Fonte estilo placar eletrônico (Orbitron) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet" />

    <style>
        /* Reset e base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Painel do letreiro */
        .letreiro-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            padding: 20px;
            min-height: 0;
        }

        .letreiro {
            width: 100%;
            height: 100%;
            background: #000;
            border: 4px solid #ffcc00;
            border-radius: 20px;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        /* Texto rolante */
        .mensagem {
            font-weight: 900;
            color: #ffcc00;
            white-space: nowrap;
            padding: 0 50px;
            position: absolute;
            animation: scroll 20s linear infinite;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: color 0.3s, font-size 0.2s, font-family 0.2s, text-shadow 0.3s;
        }

        @keyframes scroll {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* --- Controles --- */
        .controles {
            background: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 20px;
            border-top: 2px solid #333;
            flex-shrink: 0;
            max-height: 40vh;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 140px;
            min-width: 120px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #ccc;
            font-weight: 600;
            white-space: nowrap;
        }

        .control-group input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
            transition: border 0.2s;
            min-width: 100px;
        }
        .control-group input[type="text"]:focus {
            border-color: #ffcc00;
        }

        .control-group select {
            padding: 8px 12px;
            font-size: 0.95rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
        }
        .control-group select:focus {
            border-color: #ffcc00;
        }

        .control-group input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: #ffcc00;
            cursor: pointer;
        }
        .control-group .value-display {
            min-width: 35px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
        }

        .control-group input[type="color"] {
            width: 40px;
            height: 40px;
            border: 2px solid #444;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            padding: 2px;
        }
        .control-group input[type="color"]:hover {
            border-color: #ffcc00;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-group button {
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ffcc00;
            color: #000;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-group button:hover {
            background: #ffd633;
            transform: scale(1.02);
        }
        .btn-group button:active {
            transform: scale(0.97);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .letreiro-container {
                padding: 10px;
            }
            .letreiro {
                border-width: 3px;
                border-radius: 12px;
            }
            .mensagem {
                padding: 0 20px;
                letter-spacing: 2px;
            }
            .controles {
                padding: 12px 15px;
                gap: 10px;
                max-height: 50vh;
            }
            .control-group {
                flex: 1 1 100%;
                min-width: auto;
            }
            .control-group input[type="text"],
            .control-group select,
            .control-group input[type="range"] {
                flex: 1;
                min-width: 60px;
            }
            .control-group input[type="color"] {
                width: 36px;
                height: 36px;
            }
            .btn-group {
                width: 100%;
                justify-content: center;
            }
            .btn-group button {
                flex: 1;
                max-width: 200px;
            }
        }

        @media (max-width: 400px) {
            .mensagem {
                padding: 0 10px;
                letter-spacing: 1px;
            }
            .control-group label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="letreiro-container">
        <div class="letreiro">
            <div class="mensagem" id="mensagemTexto">Digite sua mensagem</div>
        </div>
    </div>

    <div class="controles">
        <!-- Texto -->
        <div class="control-group">
            <label for="inputMensagem">Texto:</label>
            <input type="text" id="inputMensagem" placeholder="Ex: Bem-vindos!" value="Digite sua mensagem" />
        </div>

        <!-- Fonte -->
        <div class="control-group">
            <label for="fontFamily">Fonte:</label>
            <select id="fontFamily">
                <option value="'Segoe UI', sans-serif">Padrão</option>
                <option value="'Orbitron', sans-serif" selected>Orbitron (Placar Eletrônico)</option>
                <option value="'Impact', sans-serif">Impact</option>
                <option value="'Arial Black', sans-serif">Arial Black</option>
                <option value="'Courier New', monospace">Courier</option>
                <option value="'Verdana', sans-serif">Verdana</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
            </select>
        </div>

        <!-- Tamanho (vw) -->
        <div class="control-group">
            <label for="fontSize">Tamanho:</label>
            <input type="range" id="fontSize" min="3" max="18" value="8" step="0.5" />
            <span class="value-display" id="fontSizeVal">8vw</span>
        </div>

        <!-- Velocidade (segundos) -->
        <div class="control-group">
            <label for="velocidade">Veloc.:</label>
            <input type="range" id="velocidade" min="5" max="60" value="20" step="1" />
            <span class="value-display" id="velocidadeValor">20s</span>
        </div>

        <!-- Cores -->
        <div class="control-group">
            <label for="textColor">Texto:</label>
            <input type="color" id="textColor" value="#ffcc00" />
        </div>
        <div class="control-group">
            <label for="bgColor">Fundo:</label>
            <input type="color" id="bgColor" value="#000000" />
        </div>
        <div class="control-group">
            <label for="borderColor">Borda:</label>
            <input type="color" id="borderColor" value="#ffcc00" />
        </div>

        <!-- Botão atualizar -->
        <div class="btn-group">
            <button id="btnAtualizar">Atualizar</button>
        </div>
    </div>

    <script>
        (function() {
            const mensagemEl = document.getElementById('mensagemTexto');
            const letreiroBox = document.querySelector('.letreiro');

            const inputMensagem = document.getElementById('inputMensagem');
            const fontFamily = document.getElementById('fontFamily');
            const fontSize = document.getElementById('fontSize');
            const fontSizeVal = document.getElementById('fontSizeVal');
            const inputVelocidade = document.getElementById('velocidade');
            const velocidadeValor = document.getElementById('velocidadeValor');
            const textColor = document.getElementById('textColor');
            const bgColor = document.getElementById('bgColor');
            const borderColor = document.getElementById('borderColor');
            const btnAtualizar = document.getElementById('btnAtualizar');

            function atualizarLetreiro() {
                // 1. Texto
                const texto = inputMensagem.value.trim();
                mensagemEl.textContent = texto === '' ? '⚠️ Digite uma mensagem' : texto;

                // 2. Velocidade
                const duracao = inputVelocidade.value;
                mensagemEl.style.animationDuration = duracao + 's';
                velocidadeValor.textContent = duracao + 's';

                // 3. Fonte
                mensagemEl.style.fontFamily = fontFamily.value;

                // 4. Tamanho (em vw)
                const size = fontSize.value;
                mensagemEl.style.fontSize = size + 'vw';
                fontSizeVal.textContent = size + 'vw';

                // 5. Cores
                const corTexto = textColor.value;
                mensagemEl.style.color = corTexto;
                mensagemEl.style.textShadow = `0 0 10px ${corTexto}, 0 0 20px ${corTexto}, 0 0 40px ${corTexto}`;

                const corFundo = bgColor.value;
                letreiroBox.style.backgroundColor = corFundo;

                const corBorda = borderColor.value;
                letreiroBox.style.borderColor = corBorda;
                letreiroBox.style.boxShadow = `0 0 30px ${corBorda}, inset 0 0 30px ${corBorda}`;
            }

            inputVelocidade.addEventListener('input', atualizarLetreiro);
            fontFamily.addEventListener('change', atualizarLetreiro);
            fontSize.addEventListener('input', atualizarLetreiro);
            textColor.addEventListener('input', atualizarLetreiro);
            bgColor.addEventListener('input', atualizarLetreiro);
            borderColor.addEventListener('input', atualizarLetreiro);

            btnAtualizar.addEventListener('click', atualizarLetreiro);
            inputMensagem.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    atualizarLetreiro();
                }
            });

            atualizarLetreiro();
        })();
    </script>
</body>
</html>
